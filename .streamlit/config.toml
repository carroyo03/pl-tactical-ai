[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1
maxMessageSize = 1
enableStaticServing = false

[client]
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#76ADFF"
backgroundColor = "#090A0F"
secondaryBackgroundColor = "#11131A"
textColor = "#E8ECF4"
font = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif'
headingFont = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif'
codeFont = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif'
