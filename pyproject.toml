[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[project]
name = "pl-tactical-ai"
version = "0.1.0"
description = "Explainable synthetic football intelligence with bounded narrative agents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-identity>=1.15.0",
    "duckdb>=0.10.0",
    "fastapi>=0.110.0",
    "httpx2>=2.12,<3",
    "networkx>=3.2.1",
    "openai>=3.35.1,<4",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.1,<2",
    "streamlit>=1.66.0,<2",
    "uvicorn>=0.28.0",
]

[tool.uv]
# Reviewed compatibility override while Streamlit retains its older Pillow ceiling.
override-dependencies = ["pillow>=13.0.0,<14"]
constraint-dependencies = ["certifi>=2026.10.19"]
