name: pl-tactical-ai
services:
  api:
    build: .
    image: pl-tactical-ai:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/goals', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
  studio:
    image: pl-tactical-ai:local
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "src/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
