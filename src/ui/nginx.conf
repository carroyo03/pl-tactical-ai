worker_processes 1;
pid /tmp/tactical-nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/tactical-client;
    proxy_temp_path /tmp/tactical-proxy;
    fastcgi_temp_path /tmp/tactical-fastcgi;
    uwsgi_temp_path /tmp/tactical-uwsgi;
    scgi_temp_path /tmp/tactical-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $server_name zone=studio_requests:1m rate=__REQUEST_RATE__r/s;
    limit_conn_zone $server_name zone=studio_connections:1m;

    server {
        listen __GATEWAY_PORT__;
        client_max_body_size 1m;
        client_header_timeout 10s;
        client_body_timeout 10s;
        keepalive_timeout 15s;
        send_timeout 30s;
        large_client_header_buffers 2 4k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=86400" always;

        location / {
            limit_req zone=studio_requests burst=80 nodelay;
            limit_req_status 429;
            limit_req_log_level notice;
            limit_conn studio_connections __CONNECTION_LIMIT__;
            limit_conn_status 429;
            limit_conn_log_level notice;
            proxy_pass http://127.0.0.1:__INTERNAL_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }
    }
}
